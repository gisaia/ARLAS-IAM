name: Release ARLAS-iam

on:
  push:
    tags:
    - '*'

jobs:
  publish-docker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Cache Maven # From https://github.com/actions/cache/blob/main/examples.md
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'adopt'
    - name: Get release version
      id: vars
      run: echo ::set-output name=tag::${GITHUB_REF#refs/*/}
    - name: Publish Docker image
      env:
        # secrets are defined here : https://github.com/organizations/gisaia/settings/secrets/actions
        DOCKER_USERNAME: ${{ secrets.DOCKER_HUB_USER }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
        RELEASE_VERSION: ${{ steps.vars.outputs.tag }}
      run: bash scripts/ci/publish_docker.sh $RELEASE_VERSION
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Cache Maven # From https://github.com/actions/cache/blob/main/examples.md
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'adopt'
    - name: Get release version
      id: vars
      run: echo ::set-output name=tag::${GITHUB_REF#refs/*/}
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        registry-url: 'https://registry.npmjs.org'
    - name: Install latest npm version
      run: npm install -g npm@10.8.2
    - name: Publish NPM client
      env:
        # secrets are defined here : https://github.com/organizations/gisaia/settings/secrets/actions
        DOCKER_USERNAME: ${{ secrets.DOCKER_HUB_USER }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
        RELEASE_VERSION: ${{ steps.vars.outputs.tag }}
        GOOGLE_CHAT_RELEASE_CHANEL: ${{ secrets.GOOGLE_CHAT_RELEASE_CHANEL }}
      run: |
        bash scripts/ci/export_swagger.sh $RELEASE_VERSION
        bash scripts/ci/publish_npm.sh $RELEASE_VERSION
        bash scripts/ci/send_message.sh $RELEASE_VERSION